<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farmer Dashboard - Farm Direct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <nav class="app-nav">
    <div class="nav-container">
      <div class="logo">Farm Direct</div>
      <div class="user-menu">
        <span class="user-greeting">Welcome, <span id="farmerName"></span></span>
        <span class="role-badge">Farmer</span>
        <button id="logoutBtn" class="secondary btn-small">Logout</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-content">

    <div class="stats-grid" id="statsGrid"></div>

    <h3>Add New Crop</h3>
    <form id="cropForm">
      <input type="text" id="cropName" placeholder="Crop name (e.g. Tomato)" required>
      <select id="cropCategory" required>
        <option value="" disabled selected>Select category</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Fruits">Fruits</option>
        <option value="Grains">Grains</option>
        <option value="Pulses">Pulses</option>
        <option value="Spices">Spices</option>
        <option value="Other">Other</option>
      </select>
      <input type="number" id="price" placeholder="Price per kg (₹)" required>
      <input type="number" id="quantity" placeholder="Quantity available (kg)" required>
      <div class="form-field-full">
        <label class="field-label" for="harvestDate">Harvest Date</label>
        <input type="date" id="harvestDate">
      </div>
      <div class="form-field-full">
        <label class="field-label" for="cropImageInput">Crop Photo</label>
        <input type="file" id="cropImageInput" accept="image/*">
        <div id="cropImagePreview" class="image-preview-box" style="display: none;">
          <img id="cropPreviewImg" src="" alt="Crop preview">
          <button type="button" class="secondary btn-small" id="removeCropImageBtn">Remove photo</button>
        </div>
      </div>
      <textarea id="description" placeholder="Description (optional)"></textarea>
      <button type="submit">Add Crop</button>
    </form>

    <h3>My Crop Listings</h3>
    <div id="cropList"></div>

    <h3>Incoming Orders</h3>
    <div id="orderList"></div>
    </div>
  </main>

  <div id="editModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3>Edit crop</h3>
      <form id="editCropForm">
        <input type="hidden" id="editCropId">
        <input type="text" id="editCropName" placeholder="Crop name" required>
        <select id="editCropCategory" required>
          <option value="Vegetables">Vegetables</option>
          <option value="Fruits">Fruits</option>
          <option value="Grains">Grains</option>
          <option value="Pulses">Pulses</option>
          <option value="Spices">Spices</option>
          <option value="Other">Other</option>
        </select>
        <input type="number" id="editPrice" placeholder="Price per kg" required>
        <input type="number" id="editQuantity" placeholder="Quantity available" required>
        <div class="form-field-full">
          <label class="field-label" for="editHarvestDate">Harvest Date</label>
          <input type="date" id="editHarvestDate">
        </div>
        <div class="form-field-full">
          <label class="field-label" for="editCropImageInput">Crop Photo (leave unchanged to keep current)</label>
          <input type="file" id="editCropImageInput" accept="image/*">
          <div id="editCropImagePreview" class="image-preview-box" style="display: none;">
            <img id="editCropPreviewImg" src="" alt="Crop preview">
            <button type="button" class="secondary btn-small" id="removeEditCropImageBtn">Remove photo</button>
          </div>
        </div>
        <textarea id="editDescription" placeholder="Description"></textarea>
        <button type="submit">Save changes</button>
        <button type="button" class="secondary" onclick="closeEditModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script src="ui.js"></script>
  <script src="farmer-dashboard.js"></script>
</body>
</html>
