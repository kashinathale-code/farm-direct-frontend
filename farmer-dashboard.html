<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farmer Dashboard - Farm Direct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <nav class="app-nav">
    <div class="nav-container">
      <div class="logo">Farm Direct</div>
      <div class="user-menu">
        <span class="user-greeting">Welcome, <span id="farmerName"></span></span>
        <span class="role-badge">Farmer</span>
        <button id="logoutBtn" class="secondary btn-small">Logout</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-content">

    <div class="stats-grid" id="statsGrid"></div>

    <h3>Add New Crop</h3>
    <form id="cropForm">
      <input type="text" id="cropName" placeholder="Crop name (e.g. Tomato)" required>
      <input type="number" id="price" placeholder="Price per kg (₹)" required>
      <input type="number" id="quantity" placeholder="Quantity available (kg)" required>
      <textarea id="description" placeholder="Description (optional)"></textarea>
      <button type="submit">Add Crop</button>
    </form>

    <h3>My Crop Listings</h3>
    <div id="cropList"></div>

    <h3>Incoming Orders</h3>
    <div id="orderList"></div>
    </div>
  </main>

  <div id="editModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3>Edit crop</h3>
      <form id="editCropForm">
        <input type="hidden" id="editCropId">
        <input type="text" id="editCropName" placeholder="Crop name" required>
        <input type="number" id="editPrice" placeholder="Price per kg" required>
        <input type="number" id="editQuantity" placeholder="Quantity available" required>
        <textarea id="editDescription" placeholder="Description"></textarea>
        <button type="submit">Save changes</button>
        <button type="button" class="secondary" onclick="closeEditModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script src="ui.js"></script>
  <script src="farmer-dashboard.js"></script>
</body>
</html>
