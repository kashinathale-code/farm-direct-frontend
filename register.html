<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farm Direct - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="form-container">
    <div class="form-header">
      <a href="index.html" class="back-link">← Home</a>
      <h2>Create Account</h2>
      <p class="tagline">Join Farm Direct today</p>
    </div>
    <form id="registerForm">
      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>
      </div>
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
      </div>
      <div class="input-group">
        <label for="role">I want to...</label>
        <select id="role" required>
          <option value="">Select Role</option>
          <option value="farmer">Sell Crops (Farmer)</option>
          <option value="buyer">Buy Crops (Buyer)</option>
        </select>
      </div>
      <div class="input-group">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. Pune (Optional)">
      </div>
      <button type="submit">Register</button>
      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </div>
  <script src="ui.js"></script>
  <script src="script.js"></script>
</body>
</html>
