<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Farm Direct</title>
  <meta name="description" content="Sign in to your Farm Direct account to manage crop listings or purchase farm-fresh produce directly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <!-- Compact Auth Header -->
  <header class="auth-compact-header">
    <div class="auth-compact-container">
      <a href="index.html" class="brand-link" aria-label="Farm Direct Home">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12A10 10 0 0 1 12 2z"/>
            <path d="M7 13c3 0 7-2 9-8-2 6-4 9-9 9z"/>
            <path d="M12 22V12"/>
          </svg>
        </div>
        <div class="brand-meta">
          <span class="brand-title">Farm Direct</span>
          <span class="brand-tagline" data-i18n="footer.tagline">Fair Agricultural Trade</span>
        </div>
      </a>
      <div class="auth-compact-actions">
        <a href="index.html" class="nav-link" data-i18n="common.home">Home</a>
        <div class="lang-selector-wrap" title="Select Language">
          <svg class="lang-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <select class="fd-language-selector" id="languageSelect" aria-label="Select Language" onchange="FD_I18N.setLanguage(this.value)">
            <option value="en">English</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="mr">मराठी (Marathi)</option>
          </select>
        </div>
        <a href="register.html" class="nav-button" data-i18n="landing.get_started">Get Started</a>
      </div>
    </div>
  </header>

  <main class="auth-main-content">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12A10 10 0 0 1 12 2z"/>
            <path d="M7 13c3 0 7-2 9-8-2 6-4 9-9 9z"/>
            <path d="M12 22V12"/>
          </svg>
        </div>

        <h2 data-i18n="auth.welcome_back">Welcome Back</h2>
        <p class="tagline" data-i18n="auth.sign_in_tagline">Sign in to your Farm Direct portal</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label class="field-label" for="email" data-i18n="auth.email_label">Email Address</label>
          <input type="email" id="email" data-i18n-attr="placeholder:auth.email_placeholder" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="field-label" for="password" style="margin-bottom:0;" data-i18n="auth.password_label">Password</label>
          </div>
          <div class="password-input-wrap" style="margin-top:6px;">
            <input type="password" id="password" data-i18n-attr="placeholder:auth.password_placeholder" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top:10px;" data-i18n="auth.sign_in_btn">Sign In to Portal</button>
        
        <p class="auth-switch">
          <span data-i18n="auth.no_account">Don't have an account yet?</span> <a href="register.html" data-i18n="auth.create_one">Create one here</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="auth-compact-footer">
    <div class="auth-footer-content">
      <span data-i18n="footer.copyright">© 2026 Farm Direct. All Rights Reserved.</span>
      <span class="footer-sep">·</span>
      <a href="index.html" data-i18n="common.home">Home</a>
      <span class="footer-sep">·</span>
      <a href="index.html#marketplace" data-i18n="landing.marketplace">Marketplace</a>
      <span class="footer-sep">·</span>
      <a href="traceability.html" data-i18n="footer.crop_traceability">Traceability</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
  <script>
    // Password toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('password');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
      });
    }
  </script>
</body>
</html>
