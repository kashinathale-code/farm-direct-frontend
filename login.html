<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farm Direct - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="form-container">
    <div class="form-header">
      <a href="index.html" class="back-link">← Home</a>
      <h2>Login</h2>
      <p class="tagline">Welcome back to Farm Direct</p>
    </div>
    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit">Login</button>
      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </form>
  </div>
  <script src="ui.js"></script>
  <script src="script.js"></script>
</body>
</html>
